name: Publish Atlas of Hair to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - '.github/workflows/publish-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check site files
        run: |
          test -s dist/index.html
          test -s dist/app.js
          test -s dist/style.css
      - name: Validate website JavaScript
        run: |
          for f in dist/*.js; do
            echo "Checking $f"
            node --input-type=module --check < "$f"
          done
      - name: Stamp file versions
        # Every publish gets its own ?v= so visitors never mix old and new files.
        run: sed -i -E "s/\?v=[0-9a-f]+/?v=${GITHUB_SHA::8}/g" dist/*.html dist/*.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
